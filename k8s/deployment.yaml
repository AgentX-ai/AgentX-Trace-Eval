apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentx-trace-eval
  labels:
    app.kubernetes.io/name: agentx-trace-eval
    app.kubernetes.io/component: engine
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentx-trace-eval
      app.kubernetes.io/component: engine
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentx-trace-eval
        app.kubernetes.io/component: engine
    spec:
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-trace-eval-secrets
                  key: POSTGRES_PASSWORD
          command:
            - sh
            - -c
            - until pg_isready -h postgres-trace-eval -p 5432 -U postgres; do echo "waiting for postgres..."; sleep 2; done
      containers:
        - name: agentx-trace-eval
          image: agentx-trace-eval:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4700
              protocol: TCP
          envFrom:
            - configMapRef:
                name: agentx-trace-eval-config
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
