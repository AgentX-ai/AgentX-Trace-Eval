apiVersion: v1
kind: Secret
metadata:
  name: postgres-trace-eval-secrets
  labels:
    app.kubernetes.io/name: agentx-trace-eval
    app.kubernetes.io/component: postgres
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  POSTGRES_DB: agentx

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-trace-eval-data
  labels:
    app.kubernetes.io/name: agentx-trace-eval
    app.kubernetes.io/component: postgres
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-trace-eval
  labels:
    app.kubernetes.io/name: agentx-trace-eval
    app.kubernetes.io/component: postgres
spec:
  serviceName: postgres-trace-eval
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: agentx-trace-eval
      app.kubernetes.io/component: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agentx-trace-eval
        app.kubernetes.io/component: postgres
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres-trace-eval
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: postgres-trace-eval-secrets
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: postgres
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-trace-eval-data

---
apiVersion: v1
kind: Service
metadata:
  name: postgres-trace-eval
  labels:
    app.kubernetes.io/name: agentx-trace-eval
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentx-trace-eval
    app.kubernetes.io/component: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
