services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .env
        required: false
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  agentx-trace-eval:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AGENTX_WEB_URL: ${AGENTX_WEB_URL:-https://github.com/AgentX-ai/AgentX-trace-eval/releases/latest/download/agentx-web.tar.gz}
    ports:
      - "${AGENTX_HOST_PORT:-4700}:${PORT:-4700}"
    env_file:
      - path: .env
        required: false
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres-data:
