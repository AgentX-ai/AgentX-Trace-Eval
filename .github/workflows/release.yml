name: Release
# Cross-compiles the CLI (Go) and engine (Bun, `bun build --compile`) for darwin/linux ×
# arm64/amd64 from a single ubuntu-latest runner (no macOS runners needed, see the "Verified"
# note below) and publishes them as a GitHub Release, matching exactly what install.sh already
# expects: an `agentx_<os>_<arch>.tar.gz` per platform containing
# `agentx`, `agentx-server`, `agentx-engine`. Does NOT build the dashboard (agentx-web.tar.gz) —
# that's a separate, platform-independent asset AgentX-eval-front's publish-selfhost-web.yml
# releases into its own `eval-front-v*` channel on every merge to its main; this workflow fetches
# the newest of those and attaches it here, so a release is an immutable engine+dashboard pair
# frozen at tag time (see README's "Dashboard release"). Fetching that private repo needs the
# EVAL_FRONT_RELEASE_TOKEN secret: a token with read access to AgentX-ai/AgentX-eval-front
# releases (the mirror image of the SELFHOST_RELEASE_TOKEN that repo holds for its manual
# attach path).
#
# Verified (2026-07-31): `bun build --compile --target=bun-linux-x64` run on macOS produces a
# real linux/amd64 ELF binary that starts, opens its SQLite DB via bun:sqlite, and serves real
# HTTP traffic inside an actual `debian:bookworm-slim` container — cross-compiling isn't just
# "produces a binary that looks right", it was run for real.
#
# Trigger: push a tag matching v* (e.g. `git tag v0.1.0 && git push origin v0.1.0`).
# workflow_dispatch also accepts a tag input, for re-running a build against an existing tag
# without pushing a new one (e.g. after fixing a build issue).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach assets to (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.TAG }}

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.14"

      - name: Set up Node.js (for yarn install, not for running the engine)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile

      - name: Build @agentx/judge-core
        # packages/judge-core is a real published-shape package (main/module/types all point at
        # dist/, built via tsup) shared with AgentX-web-api, not source the engine imports
        # directly — dist/ is gitignored (build output), so a fresh checkout has to build it
        # before `bun build` can resolve `@agentx/judge-core` from engine/src/core/evaluate/judge.ts.
        run: yarn workspace @agentx/judge-core build

      - name: Cross-compile CLI + engine for every platform
        run: |
          set -euo pipefail
          mkdir -p dist
          declare -A BUN_TARGET=(
            [darwin_arm64]=bun-darwin-arm64
            [darwin_amd64]=bun-darwin-x64
            [linux_amd64]=bun-linux-x64
            [linux_arm64]=bun-linux-arm64
          )
          declare -A GOARCH_MAP=(
            [arm64]=arm64
            [amd64]=amd64
          )
          for os in darwin linux; do
            for arch in arm64 amd64; do
              platform_dir="dist/${os}_${arch}"
              mkdir -p "$platform_dir"

              echo "::group::engine ${os}/${arch}"
              bun build engine/src/index.ts --compile \
                --target="${BUN_TARGET[${os}_${arch}]}" \
                --outfile "$platform_dir/agentx-engine"
              echo "::endgroup::"

              echo "::group::cli ${os}/${arch}"
              # go.mod lives in cli/, not the repo root (see cli/go.mod) — `go build ./cli` run
              # from here fails with "cannot find main module" since the repo root itself isn't
              # a Go module. Build from inside cli/ instead, in a subshell so the loop's own cwd
              # is untouched.
              (cd cli && GOOS="$os" GOARCH="${GOARCH_MAP[$arch]}" go build -o "../$platform_dir/agentx" .)
              cp "$platform_dir/agentx" "$platform_dir/agentx-server"
              echo "::endgroup::"

              tar -czf "dist/agentx_${os}_${arch}.tar.gz" -C "$platform_dir" agentx agentx-server agentx-engine
            done
          done
          ls -la dist/*.tar.gz

      - name: Fetch newest dashboard bundle from AgentX-eval-front
        id: web
        env:
          GH_TOKEN: ${{ secrets.EVAL_FRONT_RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          # Fails the release if no eval-front-v* bundle exists or the token can't read it: a release
          # without its dashboard half is exactly the broken pairing this step exists to end.
          # (Recovery: fix the token / run eval-front's workflow, then re-run this workflow via
          # workflow_dispatch against the same tag.)
          web_tag="$(gh release view --repo AgentX-ai/AgentX-eval-front --json tagName -q .tagName)"
          gh release download "$web_tag" --repo AgentX-ai/AgentX-eval-front \
            --pattern agentx-web.tar.gz --dir dist
          echo "web_tag=$web_tag" >> "$GITHUB_OUTPUT"
          echo "Bundling dashboard $web_tag"

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$TAG" dist/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "$TAG" \
            --notes "Dashboard: AgentX-eval-front ${{ steps.web.outputs.web_tag }}" \
            --generate-notes \
            --latest
