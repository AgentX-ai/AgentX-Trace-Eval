name: Weekly chaos drills
# Phase 6 of the trace-store plan: the runbook's failure modes, rehearsed for real - telemetry
# store killed mid-ingest (visible 503s + counted drops, control plane stays up, self-healing
# recovery), engine SIGTERM mid-burst (every acked span survives), and a ClickHouse backup
# round-trip. A drill that stops holding fails the week.
on:
  schedule:
    - cron: "42 6 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drills:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.x
          cache: yarn
          cache-dependency-path: yarn.lock
      - run: yarn install --frozen-lockfile
      - run: yarn workspace @agentx/judge-core build
      - run: node engine/scripts/chaos.mjs
